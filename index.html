<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeachLab - تحويل PDF</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات PDF.js و PptxGenJS و jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>
    <!-- مكتبة jsPDF لإنشاء ملفات الـ PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .container {
            background: #fff; width: 100%; max-width: 500px; padding: 30px; 
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center;
        }
        
        h2 { margin-bottom: 20px; color: #2563eb; font-weight: 900; }
        
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input[type="text"], input[type="number"] { 
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; 
        }
        
        .upload-btn {
            display: block; width: 100%; padding: 15px; background-color: #e5e7eb; border: 2px dashed #9ca3af;
            border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 5px;
        }
        .upload-btn input[type="file"] { display: none; }
        
        .btn-primary { 
            width: 100%; padding: 15px; background: #2563eb; color: #fff; border: none; 
            border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s;
        }
        .btn-primary:hover { background: #1d4ed8; }
        
        .btn-secondary {
            display: inline-block; padding: 10px 20px; background: #10b981; color: white;
            text-decoration: none; border-radius: 8px; font-weight: bold; margin-bottom: 15px;
        }

        .success-msg { color: #10b981; font-weight: bold; font-size: 20px; display: none; margin-bottom: 20px; }
        #step2 { display: none; }
        .status { margin-top: 15px; font-weight: bold; color: #d97706; }

        /* تنسيق أزرار التنزيل النهائية */
        #downloadSection {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        .dl-btns {
            display: flex; gap: 10px; margin-top: 15px; justify-content: center;
        }
        .btn-dl {
            flex: 1; padding: 12px; border: none; border-radius: 8px; color: white;
            font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        .btn-pptx { background-color: #d97706; } /* برتقالي للباوربوينت */
        .btn-pptx:hover { background-color: #b45309; }
        .btn-pdf { background-color: #dc2626; } /* أحمر للـ PDF */
        .btn-pdf:hover { background-color: #b91c1c; }
    </style>
</head>
<body>

    <div class="container">
        <h2>TeachLab Slide Maker</h2>

        <!-- الخطوة الأولى: إدخال الـ API -->
        <div id="step1">
            <a href="https://aistudio.google.com/app/apikey" target="_blank" class="btn-secondary">جلب الـ API</a>
            <div class="form-group">
                <input type="text" id="apiKey" placeholder="ضع مفتاح Gemini API هنا...">
            </div>
            <button class="btn-primary" id="continueBtn">متابعة لإتمام العملية</button>
        </div>

        <!-- الخطوة الثانية: الإعدادات والتحويل -->
        <div id="step2">
            <div class="success-msg" id="successMsg">نجاح ✔️</div>

            <div class="form-group">
                <label>ملف الـ PDF:</label>
                <label class="upload-btn">
                    <span id="pdfLabel">اضغط لاختيار ملف PDF</span>
                    <input type="file" id="pdfFile" accept=".pdf">
                </label>
            </div>

            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>من صفحة:</label>
                    <input type="number" id="startPage" value="1" min="1">
                </div>
                <div style="flex: 1;">
                    <label>إلى صفحة (تلقائي):</label>
                    <input type="number" id="endPage" value="1" min="1">
                </div>
            </div>

            <div class="form-group">
                <label>صورة السلايد (الخلفية):</label>
                <label class="upload-btn">
                    <span id="bgLabel">اضغط لاختيار صورة</span>
                    <input type="file" id="bgFile" accept="image/*">
                </label>
            </div>

            <button class="btn-primary" id="doneBtn">تم</button>
            <div class="status" id="statusText"></div>

            <!-- الخطوة الثالثة: أزرار التنزيل تظهر بعد الانتهاء -->
            <div id="downloadSection">
                <p style="color: #10b981; font-weight: 900; font-size: 18px;">اكتمل التجهيز بنجاح 🎉</p>
                <p style="font-size: 14px; color: #666; margin-top: 5px;">اختر صيغة الملف اللي تحب تنزله:</p>
                
                <div class="dl-btns">
                    <button class="btn-dl btn-pptx" id="dlPptxBtn">تنزيل PowerPoint</button>
                    <button class="btn-dl btn-pdf" id="dlPdfBtn">تنزيل PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pdfDoc = null;
        let globalProcessedSlides = []; // مصفوفة هنحفظ فيها السلايدات المقصوصة
        let globalBgBase64 = null; // متغير لحفظ صورة الخلفية

        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const successMsg = document.getElementById('successMsg');
        
        // 1. زر المتابعة
        document.getElementById('continueBtn').addEventListener('click', () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            if(!apiKey) { alert("لازم تحط مفتاح الـ API الأول!"); return; }
            step1.style.display = 'none';
            step2.style.display = 'block';
            successMsg.style.display = 'block';
            setTimeout(() => { successMsg.style.display = 'none'; }, 3000);
        });

        // 2. تحديث الأسماء وعدد الصفحات
        document.getElementById('bgFile').addEventListener('change', function(e) {
            document.getElementById('bgLabel').innerText = e.target.files[0] ? e.target.files[0].name : 'اضغط لاختيار صورة';
        });

        document.getElementById('pdfFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('pdfLabel').innerText = file.name;
            document.getElementById('statusText').innerText = "جاري قراءة عدد الصفحات...";

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                document.getElementById('startPage').value = 1;
                document.getElementById('endPage').value = pdfDoc.numPages;
                document.getElementById('statusText').innerText = `تم العثور على ${pdfDoc.numPages} صفحات.`;
            };
            fileReader.readAsArrayBuffer(file);
        });

        function fileToBase64(file) {
            return new Promise((resolve) => {
                if (!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
            });
        }

        async function askGemini(base64Image, apiKey) {
            const base64Data = base64Image.split(',')[1];
            const promptText = `أنت تحلل صفحة أسئلة. استخرج إحداثيات كل سؤال على حدة. 
            رد فقط بمصفوفة JSON تحتوي على كائنات فيها "top" و "bottom" كنسب مئوية (مثال 0.1 إلى 0.4).
            إذا لم تجد أسئلة رد بـ []`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Data } }] }]
                })
            });

            if (!response.ok) throw new Error("مفتاح API غير صالح.");
            const data = await response.json();
            let text = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
            try { return JSON.parse(text); } catch (e) { return []; }
        }

        // 3. زر "تم" (للمعالجة والتجهيز فقط)
        document.getElementById('doneBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            const startPage = parseInt(document.getElementById('startPage').value);
            const endPage = parseInt(document.getElementById('endPage').value);
            const bgFile = document.getElementById('bgFile').files[0];
            const statusText = document.getElementById('statusText');
            const doneBtn = document.getElementById('doneBtn');
            const downloadSection = document.getElementById('downloadSection');

            if (!pdfDoc) { alert("أرجوك ارفع ملف الـ PDF أولاً!"); return; }

            doneBtn.disabled = true;
            downloadSection.style.display = 'none'; // إخفاء أزرار التنزيل لو كان تم إظهارها قبل كده
            globalProcessedSlides = []; // تصفير المصفوفة
            statusText.innerText = "جاري التجهيز والقص عبر الذكاء الاصطناعي... برجاء الانتظار";

            try {
                globalBgBase64 = await fileToBase64(bgFile);

                for (let pageNum = startPage; pageNum <= endPage; pageNum++) {
                    statusText.innerText = `جاري معالجة صفحة رقم ${pageNum}...`;

                    const page = await pdfDoc.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    const pageImgBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    
                    let coords = await askGemini(pageImgBase64, apiKey);
                    if (!coords || coords.length === 0) coords = [{ top: 0, bottom: 1 }];

                    for (let c of coords) {
                        const qTop = c.top * canvas.height;
                        const qHeight = (c.bottom - c.top) * canvas.height;
                        
                        if (qHeight <= 0) continue;

                        const sliceCanvas = document.createElement('canvas');
                        sliceCanvas.width = canvas.width; sliceCanvas.height = qHeight;
                        sliceCanvas.getContext('2d').drawImage(canvas, 0, qTop, canvas.width, qHeight, 0, 0, canvas.width, qHeight);

                        let slideW = 10, slideH = 5.625, imgW = 8.5;
                        let imgH = imgW * (qHeight / canvas.width);
                        if (imgH > 5) { imgH = 5; imgW = imgH * (canvas.width / qHeight); }
                        
                        let xPos = (slideW - imgW)/2;
                        let yPos = (slideH - imgH)/2;

                        // حفظ بيانات السلايد في المصفوفة لاستخدامها في التنزيل لاحقاً
                        globalProcessedSlides.push({
                            imgBase64: sliceCanvas.toDataURL('image/jpeg', 0.9),
                            x: xPos, y: yPos, w: imgW, h: imgH
                        });
                    }
                }

                statusText.innerText = ""; // مسح النص
                downloadSection.style.display = 'block'; // إظهار قسم التنزيل
                
            } catch (err) {
                statusText.innerText = "حدث خطأ: " + err.message;
                statusText.style.color = "red";
            }
            
            doneBtn.disabled = false;
        });

        // 4. زر التنزيل كـ PowerPoint
        document.getElementById('dlPptxBtn').addEventListener('click', async () => {
            let pres = new PptxGenJS();
            pres.layout = 'LAYOUT_16x9';

            for (let slideData of globalProcessedSlides) {
                const slide = pres.addSlide();
                if (globalBgBase64) slide.addImage({ data: globalBgBase64, x: 0, y: 0, w: '100%', h: '100%' });
                slide.addImage({ data: slideData.imgBase64, x: slideData.x, y: slideData.y, w: slideData.w, h: slideData.h });
            }

            await pres.writeFile({ fileName: `TeachLab_${new Date().getTime()}.pptx` });
        });

        // 5. زر التنزيل كـ PDF
        document.getElementById('dlPdfBtn').addEventListener('click', () => {
            const { jsPDF } = window.jspdf;
            // مقاس السلايد بالبوصة عشان يتوافق مع أبعاد الباوربوينت (16:9)
            let doc = new jsPDF({ orientation: 'landscape', unit: 'in', format: [10, 5.625] });

            for (let i = 0; i < globalProcessedSlides.length; i++) {
                if (i > 0) doc.addPage(); // إضافة صفحة جديدة لكل سؤال (ما عدا أول سؤال)
                
                let slideData = globalProcessedSlides[i];
                
                // وضع الخلفية إذا وجدت
                if (globalBgBase64) {
                    doc.addImage(globalBgBase64, 'JPEG', 0, 0, 10, 5.625);
                }
                
                // وضع صورة السؤال المقصوصة
                doc.addImage(slideData.imgBase64, 'JPEG', slideData.x, slideData.y, slideData.w, slideData.h);
            }

            doc.save(`TeachLab_${new Date().getTime()}.pdf`);
        });

    </script>
</body>
</html>
